packages:
  - apps/*
  - packages/*
  - e2e

# Versions are pinned exactly and locked; the requirement is "latest stable", several of which
# were published within pnpm's default 24 h release-age window (docs/architecture.md §4).
minimumReleaseAge: 0

# `pnpm exec`/`pnpm run` must not trigger installs (CI=true makes them frozen and fail).
verifyDepsBeforeRun: false

allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security patches for transitive dependencies (GitHub Dependabot alerts):
# - dompurify < 3.4.17 (bundled by monaco-editor 0.57.0): SAFE_FOR_TEMPLATES / IN_PLACE bypasses.
# - esbuild < 0.25.0 (drizzle-kit's @esbuild-kit loader, dev only): dev-server request forgery.
overrides:
  dompurify: 3.4.17
  '@esbuild-kit/core-utils>esbuild': 0.25.12
